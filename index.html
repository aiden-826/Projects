
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA's Projects</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 35px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .project {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }

        .project:hover {
            transform: translateY(-6px);
            background: #374151;
            border-color: #60a5fa;
        }

        .project h2 {
            margin-top: 0;
            color: #60a5fa;
        }

        .project p {
            color: #d1d5db;
        }

        .open {
            display: inline-block;
            margin-top: 15px;
            background: #2563eb;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
        }

        footer {
            margin-top: 40px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Projects</h1>
        <p class="subtitle">Welcome to my project launcher.</p>

        <div class="projects">

            <a class="project"
               href="https://aiden-826.github.io/cwctrack/"
               target="_blank">
                <h2>CWCTrack</h2>
                <p>Open the CWCTrack website.</p>
                <span class="open">Open Project ↗</span>
            </a>

            <a class="project"
               href="https://aiden-826.github.io/PolyTrack-Archive/"
               target="_blank">
                <h2>Archives</h2>
                <p>Explore the PolyTrack Archive.</p>
                <span class="open">Open Project ↗</span>
            </a>

        </div>

        <footer>
            AA's Projects
        </footer>
    </div>

</body>
</html>
